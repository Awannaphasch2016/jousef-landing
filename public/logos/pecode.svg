<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Professional logo design for PeCode -->
  <defs>
    <linearGradient id="pcGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EE5A5A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Stylized terminal/code window -->
  <g transform="translate(15, 15)">
    <rect x="0" y="0" width="30" height="30" rx="4" stroke="url(#pcGradient)" stroke-width="2.5" fill="none"/>
    <circle cx="5" cy="5" r="1.5" fill="#FF6B6B"/>
    <circle cx="10" cy="5" r="1.5" fill="#FFB84D"/>
    <circle cx="15" cy="5" r="1.5" fill="#51CF66"/>
    <path d="M 5 12 L 10 17 L 5 22" stroke="url(#pcGradient)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="14" y1="22" x2="24" y2="22" stroke="url(#pcGradient)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Text: PeCode -->
  <text x="55" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2C3E50">
    Pe
  </text>
  <text x="77" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="300" fill="#FF6B6B">
    Code
  </text>
</svg>
