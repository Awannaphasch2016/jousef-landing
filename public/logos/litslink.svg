<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Professional logo design for LitsLink -->
  <defs>
    <linearGradient id="llGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Connected links/chain -->
  <g transform="translate(15, 20)">
    <ellipse cx="7" cy="10" rx="6" ry="8" stroke="url(#llGradient)" stroke-width="2.5" fill="none" transform="rotate(-30 7 10)"/>
    <ellipse cx="23" cy="10" rx="6" ry="8" stroke="url(#llGradient)" stroke-width="2.5" fill="none" transform="rotate(30 23 10)"/>
    <line x1="11" y1="10" x2="19" y2="10" stroke="url(#llGradient)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Text: LitsLink -->
  <text x="55" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2C3E50">
    Lits
  </text>
  <text x="91" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="300" fill="#F59E0B">
    Link
  </text>
</svg>
