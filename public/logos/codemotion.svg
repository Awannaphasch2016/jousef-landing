<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Professional logo design for Code Motion -->
  <defs>
    <linearGradient id="cmGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Stylized code brackets with motion lines -->
  <g transform="translate(15, 15)">
    <!-- Left bracket -->
    <path d="M 8 0 L 0 15 L 8 30" stroke="url(#cmGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Right bracket -->
    <path d="M 22 0 L 30 15 L 22 30" stroke="url(#cmGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Motion lines -->
    <line x1="10" y1="10" x2="14" y2="10" stroke="#4A90E2" stroke-width="2" opacity="0.6"/>
    <line x1="10" y1="15" x2="16" y2="15" stroke="#4A90E2" stroke-width="2" opacity="0.6"/>
    <line x1="10" y1="20" x2="14" y2="20" stroke="#4A90E2" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Text: CODE MOTION -->
  <text x="55" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2C3E50">
    CODE
  </text>
  <text x="55" y="42" font-family="Arial, sans-serif" font-size="14" font-weight="300" fill="#4A90E2" letter-spacing="1">
    MOTION
  </text>
</svg>
