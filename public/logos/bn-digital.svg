<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Professional logo design for BN Digital -->
  <defs>
    <linearGradient id="bnGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B894;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Digital wave/signal -->
  <g transform="translate(15, 20)">
    <path d="M 0 10 L 5 5 L 10 10 L 15 0 L 20 15 L 25 8 L 30 10"
          stroke="url(#bnGradient)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15" cy="0" r="3" fill="#00D4AA" opacity="0.3"/>
    <circle cx="20" cy="15" r="3" fill="#00D4AA" opacity="0.3"/>
  </g>

  <!-- Text: BN DIGITAL -->
  <text x="55" y="27" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#00D4AA">
    BN
  </text>
  <text x="55" y="44" font-family="Arial, sans-serif" font-size="12" font-weight="300" fill="#2C3E50" letter-spacing="2">
    DIGITAL
  </text>
</svg>
