<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Professional logo design for Requestum -->
  <defs>
    <linearGradient id="reqGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B42CC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Stylized request arrow -->
  <g transform="translate(15, 20)">
    <circle cx="0" cy="10" r="4" fill="url(#reqGradient)"/>
    <line x1="4" y1="10" x2="24" y2="10" stroke="url(#reqGradient)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 18 4 L 28 10 L 18 16" stroke="url(#reqGradient)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text: REQUESTUM -->
  <text x="55" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#2C3E50">
    REQUEST
  </text>
  <text x="128" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="300" fill="#6C63FF">
    UM
  </text>
</svg>
